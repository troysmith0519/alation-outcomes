name: Test Snowflake Connection

# Manual-only. This does NOT touch index.html or main — it just proves the
# Snowflake credentials + query work, and hands you the generated HTML as a
# downloadable artifact so you can eyeball it before anything goes live.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run build.py against Snowflake
        env:
          SNOWFLAKE_ACCOUNT:                 ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:                    ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_WAREHOUSE:               ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE:                    ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_PRIVATE_KEY:             ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:  ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: python build.py

      - name: Rename output so it can't collide with the live page
        run: mv index.html test-output.html

      - name: Upload result as a workflow artifact (nothing is committed)
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.html
